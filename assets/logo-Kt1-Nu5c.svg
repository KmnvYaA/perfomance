<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1264 1264" role="img" aria-label="Liquid glass icon">
  <defs>
    <linearGradient id="glassFill" x1="190" y1="150" x2="1060" y2="1110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF9EB" stop-opacity="0.98"/>
      <stop offset="0.22" stop-color="#E8D2AD" stop-opacity="0.92"/>
      <stop offset="0.48" stop-color="#B6B2C5" stop-opacity="0.82"/>
      <stop offset="0.72" stop-color="#F2C77E" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#8A7061" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="glassEdge" x1="240" y1="190" x2="1030" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF5"/>
      <stop offset="0.3" stop-color="#F1D8A9"/>
      <stop offset="0.56" stop-color="#AAA8BC"/>
      <stop offset="0.8" stop-color="#FFF0CC"/>
      <stop offset="1" stop-color="#C79556"/>
    </linearGradient>

    <radialGradient id="sheen" cx="0" cy="0" r="1" gradientTransform="translate(375 285) rotate(43) scale(745 610)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.78"/>
      <stop offset="0.36" stop-color="#FFF4D8" stop-opacity="0.24"/>
      <stop offset="0.7" stop-color="#AAA8BC" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="blur"/>
      <feFlood flood-color="#F2C77E" flood-opacity="0.48" result="gold"/>
      <feComposite in="gold" in2="blur" operator="in" result="glow"/>
      <feOffset in="glow" dy="14" result="offsetGlow"/>
      <feMerge>
        <feMergeNode in="offsetGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softBloom" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Soft champagne bloom; the canvas itself remains transparent. -->
  <g fill="none" stroke="#F2C77E" stroke-width="28" stroke-linejoin="round" opacity="0.24" filter="url(#softBloom)">
    <path d="M 1105 168 L 719 168 L 719 268 L 797 268 L 813 270 L 821 274 L 829 284 L 830 296 L 828 303 L 819 319 L 655 563 L 381 960 L 365 976 L 354 983 L 341 988 L 322 991 L 283 991 L 283 1091 L 1107 1091 L 1107 898 L 939 898 L 939 941 L 934 961 L 930 969 L 920 982 L 912 988 L 895 995 L 566 996 L 555 993 L 549 986 L 549 979 L 645 838 L 1010 288 L 1024 275 L 1039 269 L 1105 268 Z"/>
    <path d="M 157 168 L 157 269 L 230 270 L 246 276 L 263 291 L 297 344 L 352 436 L 489 676 L 591 527 L 589 521 L 540 442 L 454 299 L 449 287 L 450 276 L 454 272 L 461 269 L 543 268 L 543 168 Z"/>
  </g>

  <!-- Main liquid-glass body. -->
  <g fill="url(#glassFill)" stroke="url(#glassEdge)" stroke-width="9" stroke-linejoin="round" filter="url(#goldGlow)">
    <path d="M 1105 168 L 719 168 L 719 268 L 797 268 L 813 270 L 821 274 L 829 284 L 830 296 L 828 303 L 819 319 L 655 563 L 381 960 L 365 976 L 354 983 L 341 988 L 322 991 L 283 991 L 283 1091 L 1107 1091 L 1107 898 L 939 898 L 939 941 L 934 961 L 930 969 L 920 982 L 912 988 L 895 995 L 566 996 L 555 993 L 549 986 L 549 979 L 645 838 L 1010 288 L 1024 275 L 1039 269 L 1105 268 Z"/>
    <path d="M 157 168 L 157 269 L 230 270 L 246 276 L 263 291 L 297 344 L 352 436 L 489 676 L 591 527 L 589 521 L 540 442 L 454 299 L 449 287 L 450 276 L 454 272 L 461 269 L 543 268 L 543 168 Z"/>
  </g>

  <!-- A restrained highlight gives the gold surface a glass reflection. -->
  <g fill="url(#sheen)" stroke="#FFF9EA" stroke-width="2.5" stroke-linejoin="round" opacity="0.58">
    <path d="M 1105 168 L 719 168 L 719 268 L 797 268 L 813 270 L 821 274 L 829 284 L 830 296 L 828 303 L 819 319 L 655 563 L 381 960 L 365 976 L 354 983 L 341 988 L 322 991 L 283 991 L 283 1091 L 1107 1091 L 1107 898 L 939 898 L 939 941 L 934 961 L 930 969 L 920 982 L 912 988 L 895 995 L 566 996 L 555 993 L 549 986 L 549 979 L 645 838 L 1010 288 L 1024 275 L 1039 269 L 1105 268 Z"/>
    <path d="M 157 168 L 157 269 L 230 270 L 246 276 L 263 291 L 297 344 L 352 436 L 489 676 L 591 527 L 589 521 L 540 442 L 454 299 L 449 287 L 450 276 L 454 272 L 461 269 L 543 268 L 543 168 Z"/>
  </g>
</svg>
